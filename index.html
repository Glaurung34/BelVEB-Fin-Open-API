function ep(e,gi,ei){

  <div class="box" id="d-err"><h3>Ошибки</h3>${table(["Код","Когда возникает"],[["400 Bad Request","Неверные или отсутствующие параметры, неподходящий статус согласия"],["401 Unauthorized","Токен отсутствует, истёк, или УНК клиента не совпадает с согласием"],["403 Forbidden","У приложения нет нужного разрешения"],["404 Not Found","Согласие, счёт или ресурс не найдены"],["5xx","Ошибка на стороне банка; повторите запрос с тем же x-idempotency-key"]])}</div>`;
  main+=a.groups.map((g,gi)=>`<section class="group" id="${g.id}"><h2>${g.name}</h2><p>${g.desc}</p>${g.eps.map((e,ei)=>ep(e,key+gi,ei)).join("")}</section>`).join("");
  return `<div class="docs"><aside class="toc">${toc}</aside><div style="min-width:0">${main}</div></div>`;
}

let state={api:"accounts",tab:"review"};
function render(){
  const a=APIS[state.api];
  document.querySelectorAll("[data-api]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.api===state.api));
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  document.getElementById("apiTitle").textContent=a.title;
  document.getElementById("apiLead").textContent=a.lead;
  document.getElementById("ver").textContent=a.ver;
  const v=document.getElementById("view");
  v.innerHTML= state.tab==="review"?review(a): state.tab==="guides"?guides(a): doc(a,state.api[0]);
}
function go(api,tab){state.api=api;state.tab=tab;try{history.replaceState(null,"","#"+api+"-"+tab)}catch(e){};render()}
document.querySelectorAll("[data-api]").forEach(b=>b.onclick=()=>go(b.dataset.api,state.tab));
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(state.api,b.dataset.tab));
document.getElementById("view").addEventListener("click",e=>{
  const c=e.target.closest(".copy"); if(!c) return;
  const t=c.dataset.copy.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  const done=()=>{c.textContent="Скопировано";setTimeout(()=>c.textContent="Копировать",1500)};
  try{navigator.clipboard.writeText(t).then(done,()=>{sel(c)})}catch(_){sel(c)}
});
function sel(c){const s=c.previousElementSibling;const r=document.createRange();r.selectNodeContents(s);const w=getSelection();w.removeAllRanges();w.addRange(r)}
const m=(location.hash||"").slice(1).match(/^(accounts|payments)-(review|guides|doc)$/);
if(m){state.api=m[1];state.tab=m[2]}
render();
</script>
